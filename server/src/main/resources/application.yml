server:
  port: 8080

spring:
  application:
    name: graduate-generation-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/graduate_generation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:20030401}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.graduation.crm: debug

ai:
  provider: qwen
  model-name: qwen3.5-omni-plus
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: sk-3ba77603db6f4e7c99a53dd4ba98d904
  temperature: 0.7
  max-tokens: 2000
  top-p: 0.9
  timeout-seconds: 60
  save-call-log: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
