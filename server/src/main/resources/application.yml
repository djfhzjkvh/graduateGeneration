server:
  port: 8080

spring:
  application:
    name: graduate-generation-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/graduate_generation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:20030401}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:60MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    com.graduation.crm: debug

ai:
  provider: qwen
  model-name: qwen3.5-omni-plus
  audio-model-name: qwen-omni-turbo
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${QWEN_API_KEY:}
  temperature: 0.7
  max-tokens: 2000
  top-p: 0.9
  timeout-seconds: 60
  save-call-log: true

file:
  upload-dir: ${FILE_UPLOAD_DIR:D:/Develop/code/graduateGeneration/upload}
  access-prefix: /uploads

security:
  enabled: ${SECURITY_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
